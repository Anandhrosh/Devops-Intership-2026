apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v1
  labels:
    app: canary-demo
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: canary-demo
      version: v1
  template:
    metadata:
      labels:
        app: canary-demo
        version: v1
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo 'Version 1.0 - Stable' > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'