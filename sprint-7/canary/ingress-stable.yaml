apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-stable-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: canary.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-v1-service
                port:
                  number: 80