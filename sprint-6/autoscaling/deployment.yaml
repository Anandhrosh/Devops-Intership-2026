apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprint6-app
  labels:
    app: sprint6-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sprint6-app
  template:
    metadata:
      labels:
        app: sprint6-app
    spec:
      containers:
        - name: app
          image: registry.k8s.io/hpa-example
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
