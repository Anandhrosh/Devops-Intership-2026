replicaCount: 2

image:
  repository: sprint2-go-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 3000
  targetPort: 3000
  nodePort: 30080

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

config:
  APP_ENV: "production"
  APP_NAME: "sprint2-go-app"
  LOG_LEVEL: "info"