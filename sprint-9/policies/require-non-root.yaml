apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-pod-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Pods must set runAsNonRoot to true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
