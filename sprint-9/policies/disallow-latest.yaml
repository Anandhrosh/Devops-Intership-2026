apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: block-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Using the :latest image tag is not allowed. Specify a versioned image tag."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
