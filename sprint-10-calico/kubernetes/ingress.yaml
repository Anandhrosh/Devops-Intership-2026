apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capstone-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: capstone.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: capstone-backend-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: capstone-frontend-service
                port:
                  number: 8080
