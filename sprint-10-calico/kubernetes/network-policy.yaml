apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: capstone-database-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: capstone-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: backend
      ports:
        - protocol: TCP
          port: 5432
